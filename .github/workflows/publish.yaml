name: publish

# Uploads to PyPI when a GitHub release is published, through PyPI's trusted
# publishing: PyPI trusts this workflow, in this repository, in the `pypi`
# environment, so no PyPI token exists anywhere. The publisher is registered at
# https://pypi.org/manage/project/datom/settings/publishing/ with owner
# amashadihossein, repository datom-py, workflow publish.yaml, environment pypi.
# Renaming this file or the environment breaks publishing until that entry is
# updated to match.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/datom/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$version __init__=$init"
          test "$TAG" = "v$version" && test "$init" = "$version"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datom
    permissions:
      id-token: write   # the short-lived identity PyPI checks; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
